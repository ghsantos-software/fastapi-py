services:
  api:
    build: .
    image: fastapi-py:latest
    container_name: fastapi-py
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mantém banco.db e o código sincronizados com a sua pasta local.
      # Para dev; em produção troca por Postgres.
      - .:/app
    restart: unless-stopped