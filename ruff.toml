target-version = "py312"
line-length = 100

extend-exclude = ["alembic", ".venv", "venv"]

[lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["database", "main"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]
