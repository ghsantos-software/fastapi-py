name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: tarefas
          POSTGRES_PASSWORD: tarefas
          POSTGRES_DB: tarefas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarefas -d tarefas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tarefas:tarefas@localhost:5432/tarefas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Aplicar migrações
        run: alembic upgrade head

      - name: Checar divergência modelo x migração
        run: alembic check

      - name: Testes
        run: pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t tarefas-api:ci .

      - name: Smoke test (a imagem SOBE?)
        run: docker run --rm --entrypoint python tarefas-api:ci -c "import main; print('imagem OK')"