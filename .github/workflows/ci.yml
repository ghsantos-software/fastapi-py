name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: dummy-key-for-ci
      ALGORITHM: HS256
      ACESS_TOKEN_EXPIRE_MINUTES: "30"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Apply migration disposable SQLite database
        run: alembic upgrade head

      - name: Check for drift between models and migrations
        run: alembic check

      - name: Smoke test de import
        run: python -c "import main; print('app importa OK')"

      - name: Testes
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (valida o Dockerfile, sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fastapi-py:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max