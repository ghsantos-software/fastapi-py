name: Terraform

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  pull_request:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4

      - name: Formatação
        run: terraform fmt -check -recursive

      - name: Inicializar (sem backend)
        run: terraform init -backend=false

      - name: Validar
        run: terraform validate