version: 2
updates:
  # dependências Python (requirements.txt / requirements-dev.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  # as actions usadas nos workflows (uses: actions/checkout@v4 ...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # a imagem base do Dockerfile (FROM python:3.12-slim)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly