version: 2
updates:
  # dependências Python (requirements.txt / requirements-dev.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      # pydantic e pydantic_core são acoplados (o core em Rust tem faixa
      # estreita de versão compatível) — sem isso o Dependabot bumpa um
      # sem o outro e quebra o "pip install" (foi o que houve no PR #36).
      pydantic:
        patterns:
          - "pydantic*"

  # as actions usadas nos workflows (uses: actions/checkout@v4 ...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # a imagem base do Dockerfile (FROM python:3.12-slim)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly